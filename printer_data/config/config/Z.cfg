[stepper_z]
# connected to MOTOR 4

step_pin: PF9
dir_pin: PF10
enable_pin: !PG2

rotation_distance: 4
microsteps: 16
endstop_pin: probe:z_virtual_endstop
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 0
position_max: 250
position_min: -5

[tmc2209 stepper_z]
uart_pin: PF2
interpolate: true
run_current: 1
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z1]
# connected to Motor 5
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1

rotation_distance: 4
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: PE4
interpolate: true
run_current: 1
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z2]
# connected to MOTOR 6
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4

rotation_distance: 4
microsteps: 16

[tmc2209 stepper_z2]
uart_pin: PE1
interpolate: true
run_current: 1
sense_resistor: 0.110
stealthchop_threshold: 0