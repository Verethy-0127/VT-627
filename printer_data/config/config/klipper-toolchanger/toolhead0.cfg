[mcu head0]
canbus_uuid: 3ab75a311ae0

[extruder]
gear_ratio: 50:10
rotation_distance: 22.3399
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
max_extrude_only_distance: 250
max_extrude_cross_section: 5

min_temp: -200
max_temp: 500
max_power: 1.0
min_extrude_temp: -200
pressure_advance: 0.0276
pressure_advance_smooth_time: 0.02

step_pin: head0:PB14
dir_pin: !head0:PA8
enable_pin: !head0:PB6

heater_pin: head0:PB4
sensor_pin: head0:PA3
sensor_type: ATC Semitec 104NT-4-R025H42G
pullup_resistor: 2200

control: pid
pid_kp: 24.751
pid_ki: 2.292
pid_kd: 66.828


[tmc2209 extruder]
uart_pin: head0:PB3
interpolate: True
run_current: 0.35
hold_current: 0.35
sense_resistor: 0.110
stealthchop_threshold: 500



[heater_fan T0_extruder_fan]
pin: head0:PD2  # "FAN0"
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

[multi_pin pcf_fan]
pins: head0:PD3, head0:PA5

[fan_generic part_fan_t0]
pin: multi_pin:pcf_fan

[gcode_macro T0]
variable_color: ""
gcode:
  SELECT_TOOL T=0

[neopixel th_leds_t0]
pin: head0: PC7
chain_count: 3
color_order: GRBW
#   Set the pixel order required by the LED hardware. Options are GRB,
#   RGB, GRBW, or RGBW. The default is GRB.
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 1.0
initial_WHITE: 0.0
#   Sets the initial LED color of the Neopixel. Each value should be
#   between 0.0 and 1.0. The WHITE option is only available on RGBW
#   LEDs. The default for each color is 0.#

[tool T0]
tool_number: 0
extruder: extruder
fan: fan_generic part_fan_t0
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0
# Position with the toolhead aligned with the dock
params_park_x: 2.8
params_detach_x: 8
#params_detach_x: 8

[tool_probe T0]
pin: head0:PB8
tool: 0
z_offset: -0.5
speed: 2.5
samples: 3
samples_result: median
sample_retract_dist: 1.0
samples_tolerance: 0.04
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder

[temperature_sensor head0_mcu_temp]
sensor_type: temperature_mcu
sensor_mcu: head0
min_temp: 0
max_temp: 100

[lis2dw head0]
cs_pin: head0:PB1
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,y,z

[filament_switch_sensor upper_extruder0]
pause_on_runout: False
switch_pin: ^head0: PD0

[filament_switch_sensor lower_extruder0]
pause_on_runout: False
switch_pin: head0: PA15